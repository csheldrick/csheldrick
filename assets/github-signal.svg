<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">GitHub signal for csheldrick</title>
  <desc id="desc">Bootstrap image for the custom GitHub statistics generator.</desc>
  <rect width="1000" height="660" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="658" rx="18" fill="none" stroke="#1f6f3f" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="38" y="54" fill="#39d353" font-size="20" font-weight="700">&gt; github.signal --user csheldrick</text>
    <text x="38" y="84" fill="#7d8590" font-size="14">custom renderer armed · live GitHub data refreshes after merge</text>
    <rect x="38" y="124" width="924" height="430" rx="12" fill="#0b1510" stroke="#1f2933"/>
    <text x="70" y="190" fill="#26a641" font-size="14">[ generator ]</text>
    <text x="70" y="230" fill="#c9d1d9" font-size="17">public GitHub API → real activity → static SVG → profile</text>
    <text x="70" y="278" fill="#7d8590" font-size="14">365d contributions · merged PRs · upstream merges · recent velocity</text>
    <text x="70" y="310" fill="#7d8590" font-size="14">activity heatmap · public code mix · recently active repositories</text>
    <text x="70" y="374" fill="#39d353" font-size="16">no third-party stats service</text>
    <text x="70" y="406" fill="#39d353" font-size="16">no profile-view counter</text>
    <text x="70" y="438" fill="#39d353" font-size="16">no productivity score</text>
    <text x="70" y="502" fill="#7d8590" font-size="13">This bootstrap frame is replaced automatically by scripts/generate_profile_stats.py.</text>
    <circle cx="930" cy="520" r="6" fill="#39d353"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="38" y="616" fill="#7d8590" font-size="13">signal source: GitHub API · repository details rendered from public data only</text>
  </g>
</svg>
