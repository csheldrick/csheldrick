name: Profile signal

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - profile/merge-activity-signal
    paths:
      - scripts/profile_signal.py
      - .github/workflows/profile-signal.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub signal
        env:
          PROFILE_USER: csheldrick
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          PROFILE_PRIVATE: ${{ secrets.PROFILE_STATS_TOKEN != '' && '1' || '0' }}
        run: python scripts/profile_signal.py

      - name: Commit refreshed signal
        shell: bash
        run: |
          if git diff --quiet -- assets/github-signal.svg; then
            echo "Profile signal is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-signal.svg
          git commit -m "chore: refresh profile signal [skip ci]"
          git push
